[project]
name = "books"
version = "0.1.0"
description = "My small books app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
    "sqlalchemy>=2.0.49",
    "typer>=0.25.1",
]

[project.scripts]
books = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ipython>=9.14.0",
]
